name: Format backend core
on:
  push:
    branches: [refactor/backend-core]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Show formatter diff
        run: git diff -- src/server/database.server.ts src/server/request.server.ts
