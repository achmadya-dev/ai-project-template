services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: app_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["app-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  db-test:
    image: postgres:17.9-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: app_test
    ports: ["127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: local_only_root_password
      MYSQL_USER: app
      MYSQL_PASSWORD: local_only_password
      MYSQL_DATABASE: app_dev
    ports: ["127.0.0.1:${MYSQL_DEV_PORT:-3307}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
  mysql-test:
    image: mysql:8.4
    profiles: [test]
    environment:
      MYSQL_ROOT_PASSWORD: local_only_root_password
      MYSQL_USER: app
      MYSQL_PASSWORD: local_only_password
      MYSQL_DATABASE: app_test
    ports: ["127.0.0.1:${MYSQL_TEST_PORT:-3308}:3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  app-data:
  mysql-data:
