name: Refresh formatter baseline

on:
  push:
    branches: [chore/tailwind-husky]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/tailwind-husky
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      - run: bun run format
      - name: Commit lockfile and formatter baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json prettier.config.mjs eslint.config.js vite.config.ts vitest.config.ts playwright.config.ts tsconfig.json src tests scripts
          if git diff --cached --quiet; then
            echo "Formatter baseline and lockfile are already current"
            exit 0
          fi
          git commit -m "style: apply repository formatter"
          git push origin HEAD:chore/tailwind-husky
